name: Release

# Builds signed desktop bundles for macOS (universal), Windows and Linux (x86_64)
# on a version tag, publishes them to a GitHub Release, and generates the signed
# updater manifest (latest.json) that the in-app updater reads. See src-tauri's
# plugins.updater config and src/tabs/About.tsx.
#
# Linux ships .deb + .rpm and deliberately NOT an AppImage, so it contributes no
# updater artifacts — `updates::supported()` reports false on Linux and the About
# tab hides its update section (a package-manager-owned install isn't ours to
# replace). `bundle.targets` is "all", so `--bundles` is what does the excluding.
#
# The AppImage is not a preference, it's blocked: linuxdeploy rpath-patches every
# ELF in the AppDir's usr/bin to `$ORIGIN/../lib`, including our bun-compiled
# ink-city-osm-cli sidecar, and with that RUNPATH in place `ldd` on it exits 1 —
# which aborts linuxdeploy's gtk plugin and fails the bundle *after* the release
# build has compiled. patchelf can't undo it either: rewriting the ELF shifts the
# offsets bun uses to find its embedded payload and the binary segfaults. The way
# to an AppImage is to stop shipping the sidecar as an `externalBin` in usr/bin
# (a resource spawned by path instead), which is its own change.
#
# Draft-then-publish: release-please creates the GitHub Release as a *draft*
# (see release-please-config.json `draft: true`). A draft is excluded from
# `releases/latest`, so the updater endpoint keeps resolving to the previous
# fully-built release while these matrix builds run — no window where `latest`
# points at a release that has no latest.json yet. The `publish` job below
# flips the release to public+latest only after ALL THREE platforms finish
# uploading, so assets and "latest" status switch over atomically.
#
# To cut a release: bump the version in package.json + src-tauri/tauri.conf.json,
# commit, then push a matching tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/inkcity-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the key's password (empty string if none)

on:
  push:
    tags:
      - "v*"
  # Manually re-run the full signed build against an EXISTING version tag. A
  # `ci:`-only commit never cuts a new release (release-please only bumps on
  # feat/fix), so it never creates the `vX.Y.Z` tag that normally triggers this
  # workflow — meaning a fix to this very workflow can't be exercised by the
  # commit that makes it. Dispatching with the last version tag rebuilds it and
  # re-uploads assets to its (draft) release. See docs/ci-release-troubleshooting.md.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to (re)build, e.g. v0.6.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --verbose is load-bearing on macOS, not leftover debugging. When
          # `actool` rejects the icon catalog, tauri-bundler reports only
          # "failed to run actool" — it captures actool's stdout/stderr but
          # emits them through log::debug!, so at the default log level the
          # actual complaint is discarded and the build fails with nothing to
          # go on. Verbose keeps those lines. See docs/ci-release-troubleshooting.md.
          - platform: macos-latest
            args: "--target universal-apple-darwin --verbose"
          - platform: windows-latest
            args: ""
          # Pinned, not `ubuntu-latest`. An AppImage links against the glibc of
          # the machine that built it and refuses to start on anything older, so
          # this label *is* our minimum supported distribution — letting it move
          # with `latest` would raise that floor on whatever day GitHub reassigns
          # the label, breaking users with no commit to point at.
          #
          # 24.04 (glibc 2.39) rather than the 22.04 (glibc 2.35) that would
          # reach further back: the Ubuntu 22 images begin deprecation on
          # 2026-09-17 and go fully unsupported by 2027-04-17
          # (actions/runner-images#14254), so pinning there buys a few months of
          # extra reach and then fails the release. If Debian 12 / Ubuntu 22.04
          # users need the AppImage later, the fix is to build in an
          # `ubuntu:22.04` *container* on a supported runner, which decouples the
          # glibc floor from the runner lifecycle entirely.
          - platform: ubuntu-24.04
            args: "--bundles deb,rpm"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # On a tag push this resolves to the pushed tag; on manual dispatch,
          # to the `tag` input — so we always build the tagged commit, never
          # whatever branch the dispatch happened from.
          ref: ${{ inputs.tag || github.ref_name }}

      # Tauri's Linux prerequisites. webkit2gtk-4.1 is the webview (4.0 is the
      # Tauri v1 one and won't do); libayatana-appindicator3 is what the tray
      # icon is published through; libxdo is what makes the predefined menu items
      # work; librsvg2, patchelf, file and xdg-utils are bundler-side.
      #
      # The list is deliberately the full Tauri set rather than the subset the
      # deb/rpm bundlers strictly need, so it also stands on its own for a
      # minimal Debian (see docs/detail.md's prerequisites) and doesn't have to
      # be revisited if the AppImage is ever unblocked.
      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            xdg-utils \
            build-essential \
            curl wget file libssl-dev libgtk-3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Compiles scripts/osm-cli.ts (see src/core/osm/fetch-city.ts) into the
      # bundled sidecar binary the desktop app runs for live OSM fetches (a CDN
      # miss, a user-entered custom location, or Dev Mode's bypass). Same
      # implementation as the precache job, just packaged for the app instead of
      # run from CI. See scripts/build-sidecar.ts and tauri.conf.json's
      # bundle.externalBin.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # `tauri build --target universal-apple-darwin` needs sidecar binaries
      # under BOTH naming schemes, because two different stages resolve the
      # externalBin path independently: build.rs runs once per real arch
      # (TARGET=aarch64-apple-darwin, then TARGET=x86_64-apple-darwin — cargo
      # has no such thing as a "universal" target) and looks up the
      # arch-specific name each time, while the bundler's final packaging
      # step runs once, after both cargo passes, and looks up the
      # `-universal-apple-darwin` name to embed in the app. So all three
      # files — both arch binaries and the lipo'd universal one — must exist
      # together; don't delete the arch ones after lipo-ing.
      - name: Build osm-cli sidecar (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: |
          npx tsx scripts/build-sidecar.ts --bun-target=bun-darwin-arm64 --triple=aarch64-apple-darwin
          npx tsx scripts/build-sidecar.ts --bun-target=bun-darwin-x64 --triple=x86_64-apple-darwin
          lipo -create \
            src-tauri/binaries/ink-city-osm-cli-aarch64-apple-darwin \
            src-tauri/binaries/ink-city-osm-cli-x86_64-apple-darwin \
            -output src-tauri/binaries/ink-city-osm-cli-universal-apple-darwin

      - name: Build osm-cli sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: npx tsx scripts/build-sidecar.ts --bun-target=bun-windows-x64 --triple=x86_64-pc-windows-msvc

      # glibc build (`bun-linux-x64`, not `-musl`): it has to run on the same
      # systems the bundles target, and deb/rpm/AppImage are all glibc.
      - name: Build osm-cli sidecar (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: npx tsx scripts/build-sidecar.ts --bun-target=bun-linux-x64 --triple=x86_64-unknown-linux-gnu

      # macOS 26 draws the app icon from a compiled asset catalog rather than the
      # .icns (see the verification step after the build), and `actool` — which
      # compiles it — ships only inside full Xcode. tauri-bundler silently skips
      # the catalog when actool reports `short-bundle-version` < 26, so pin the
      # toolchain instead of inheriting whatever the image defaults to: GitHub now
      # cuts one runner image per major Xcode, and an Xcode 27 image is already in
      # preview.
      #
      # Probe the current selection first and only sweep /Applications when it is
      # too old. Every probe runs a real actool, and actool is a client of a
      # long-lived `ibtoold` daemon — so touching fifteen other Xcodes to confirm
      # what the default already answers is both slow and a way to leave daemons
      # from foreign toolchains running during the build.
      - name: Select an Xcode whose actool can compile the icon catalog
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Mirrors tauri-bundler's parse of
          #   /* com.apple.actool.version */
          #   bundle-version: 24411
          #   short-bundle-version: 26.1
          # `actool` is an xcrun shim, so DEVELOPER_DIR selects which one answers.
          actool_major() {
            DEVELOPER_DIR="$1" actool --version --output-format=human-readable-text 2>/dev/null \
              | sed -n 's/^[[:space:]]*short-bundle-version:[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
              | head -1
          }

          current="$(xcode-select -p)"
          major="$(actool_major "$current" || true)"
          echo "current: $current -> actool ${major:-none}"

          if [ -z "${major:-}" ] || [ "$major" -lt 26 ]; then
            for dev in /Applications/Xcode*.app/Contents/Developer; do
              [ -d "$dev" ] || continue
              m="$(actool_major "$dev" || true)"
              [ -n "${m:-}" ] || continue
              echo "  candidate: $dev -> actool $m"
              if [ "$m" -ge 26 ]; then
                echo "Selecting $dev (actool $m)"
                sudo xcode-select -s "$dev"
                major="$m"
                break
              fi
            done
          fi

          if [ -z "${major:-}" ] || [ "$major" -lt 26 ]; then
            echo "::error::no installed Xcode has actool >= 26; the macOS 26 icon catalog cannot be compiled"
            exit 1
          fi

      # Compile icons/InkCity.icon into icons/Assets.car ourselves and let the
      # bundler copy it, instead of letting the bundler drive actool. Its own path
      # crashes actool on macOS 26 (tauri-apps/tauri#15315, still open; the same
      # command run from a shell succeeds), and `create_assets_car_file` returns
      # on the first `.car` entry in bundle.icon, so a pre-compiled catalog skips
      # the broken code entirely. Gitignored, same as the osm-cli sidecar.
      - name: Compile the macOS icon catalog
        if: matrix.platform == 'macos-latest'
        run: pnpm icon:car

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "InkCity ${{ inputs.tag || github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # macOS 26 renders the app icon from a compiled asset catalog, not the
      # .icns: the bundler runs `actool` over src-tauri/icons/InkCity.icon to
      # produce Contents/Resources/Assets.car and names it in CFBundleIconName.
      # When actool is missing or older than 26 the bundler logs one line and
      # returns Ok(None) — build succeeds, gets signed, gets published, and the
      # icon silently falls back to the .icns (which macOS 26 then parks in a
      # grey rounded-rect plate). The step above is what prevents that; this one
      # is the backstop, covering the ways the catalog can come out empty even
      # with a new enough actool.
      #
      # Note this runs *after* tauri-action has already uploaded its assets, so a
      # failure here leaves a draft release holding a bad build. That's the
      # intended shape, not an oversight: `publish` needs this job, so the release
      # stays a draft and the updater never sees it. Re-running the workflow
      # against the same tag overwrites the assets in place.
      - name: Verify the macOS 26 icon was compiled into the bundle
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          if [ ${#apps[@]} -ne 1 ]; then
            echo "::error::expected exactly one .app, found ${#apps[@]}"
            exit 1
          fi
          app="${apps[0]}"
          if [ ! -f "$app/Contents/Resources/Assets.car" ]; then
            echo "::error::Assets.car missing from $app — actool was skipped (Xcode < 26?)"
            actool --version --output-format=human-readable-text || true
            exit 1
          fi
          plutil -extract CFBundleIconName raw -o - "$app/Contents/Info.plist" \
            || { echo "::error::CFBundleIconName missing — macOS 26 would fall back to the .icns"; exit 1; }
          # Informational, not a gate: InkCity.icon carries dark-appearance layer
          # variants, so a healthy catalog lists NSAppearanceNameDarkAqua here.
          # Not asserted because assetutil's output format isn't contractual and a
          # false failure would block a release over formatting.
          echo "--- appearances in Assets.car ---"
          assetutil --info "$app/Contents/Resources/Assets.car" | grep -i appearance | sort -u || true

  # Flip the draft release to public + latest, but only after every matrix build
  # has succeeded and uploaded its assets. With fail-fast: false, a single
  # platform failure leaves the release as a draft (invisible to the updater),
  # so users never see a half-built release — and since `needs` waits on the whole
  # matrix, adding a platform extends that guarantee with no change here.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release (draft -> public + latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
