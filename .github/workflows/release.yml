name: Release

# Builds signed desktop bundles for macOS (universal) and Windows on a version
# tag, publishes them to a GitHub Release, and generates the signed updater
# manifest (latest.json) that the in-app updater reads. See src-tauri's
# plugins.updater config and src/tabs/About.tsx.
#
# Draft-then-publish: release-please creates the GitHub Release as a *draft*
# (see release-please-config.json `draft: true`). A draft is excluded from
# `releases/latest`, so the updater endpoint keeps resolving to the previous
# fully-built release while these matrix builds run — no window where `latest`
# points at a release that has no latest.json yet. The `publish` job below
# flips the release to public+latest only after BOTH platforms finish uploading,
# so assets and "latest" status switch over atomically.
#
# To cut a release: bump the version in package.json + src-tauri/tauri.conf.json,
# commit, then push a matching tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/inkcity-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the key's password (empty string if none)

on:
  push:
    tags:
      - "v*"
  # Manually re-run the full signed build against an EXISTING version tag. A
  # `ci:`-only commit never cuts a new release (release-please only bumps on
  # feat/fix), so it never creates the `vX.Y.Z` tag that normally triggers this
  # workflow — meaning a fix to this very workflow can't be exercised by the
  # commit that makes it. Dispatching with the last version tag rebuilds it and
  # re-uploads assets to its (draft) release. See docs/ci-release-troubleshooting.md.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to (re)build, e.g. v0.6.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # On a tag push this resolves to the pushed tag; on manual dispatch,
          # to the `tag` input — so we always build the tagged commit, never
          # whatever branch the dispatch happened from.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Compiles scripts/osm-cli.ts (see src/core/osm/fetch-city.ts) into the
      # bundled sidecar binary the desktop app runs for live OSM fetches (a CDN
      # miss, a user-entered custom location, or Dev Mode's bypass). Same
      # implementation as the precache job, just packaged for the app instead of
      # run from CI. See scripts/build-sidecar.ts and tauri.conf.json's
      # bundle.externalBin.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # `tauri build --target universal-apple-darwin` needs sidecar binaries
      # under BOTH naming schemes, because two different stages resolve the
      # externalBin path independently: build.rs runs once per real arch
      # (TARGET=aarch64-apple-darwin, then TARGET=x86_64-apple-darwin — cargo
      # has no such thing as a "universal" target) and looks up the
      # arch-specific name each time, while the bundler's final packaging
      # step runs once, after both cargo passes, and looks up the
      # `-universal-apple-darwin` name to embed in the app. So all three
      # files — both arch binaries and the lipo'd universal one — must exist
      # together; don't delete the arch ones after lipo-ing.
      - name: Build osm-cli sidecar (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: |
          npx tsx scripts/build-sidecar.ts --bun-target=bun-darwin-arm64 --triple=aarch64-apple-darwin
          npx tsx scripts/build-sidecar.ts --bun-target=bun-darwin-x64 --triple=x86_64-apple-darwin
          lipo -create \
            src-tauri/binaries/osm-cli-aarch64-apple-darwin \
            src-tauri/binaries/osm-cli-x86_64-apple-darwin \
            -output src-tauri/binaries/osm-cli-universal-apple-darwin

      - name: Build osm-cli sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: npx tsx scripts/build-sidecar.ts --bun-target=bun-windows-x64 --triple=x86_64-pc-windows-msvc

      # macOS 26 draws the app icon from a compiled asset catalog rather than the
      # .icns (see the verification step after the build). Two separate things can
      # go wrong there, and by default both only surface after a full Rust build:
      #
      #   1. actool ships only inside full Xcode, and tauri-bundler silently skips
      #      the catalog when `short-bundle-version` < 26. The runner's default
      #      Xcode moves with the image — GitHub now cuts one image per major
      #      Xcode, and an Xcode 27 image is already in preview — so choose
      #      explicitly rather than inheriting whatever the image ships.
      #   2. actool can reject the catalog itself. tauri-bundler surfaces that as a
      #      bare "failed to run actool"; actool's own diagnostics go through
      #      log::debug!, so at normal log level they are lost entirely. That is
      #      exactly how v0.10.0 failed, ~7 minutes into the build, with no clue
      #      as to which part of icon.json actool disliked.
      #
      # So: select an Xcode, then dry-run the *same* actool invocation the bundler
      # will make (it copies the .icon to `Icon.icon` and passes `--app-icon Icon`,
      # so the stem matters) and let actool print for itself. Seconds, not minutes,
      # and the error is actool's own.
      - name: Select Xcode and dry-run actool on the icon catalog
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Mirrors tauri-bundler's parse of
          #   /* com.apple.actool.version */
          #   bundle-version: 24411
          #   short-bundle-version: 26.1
          # `actool` is an xcrun shim, so DEVELOPER_DIR selects which one answers.
          actool_major() {
            DEVELOPER_DIR="$1" actool --version --output-format=human-readable-text 2>/dev/null \
              | sed -n 's/^[[:space:]]*short-bundle-version:[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
              | head -1
          }

          best_dir=""
          best_major=0
          for dev in "$(xcode-select -p)" /Applications/Xcode*.app/Contents/Developer; do
            [ -d "$dev" ] || continue
            major="$(actool_major "$dev")" || continue
            [ -n "$major" ] || continue
            echo "  $dev -> actool $major"
            if [ "$major" -gt "$best_major" ]; then
              best_major="$major"
              best_dir="$dev"
            fi
          done

          if [ "$best_major" -lt 26 ]; then
            echo "::error::no installed Xcode has actool >= 26 (best: ${best_major} at ${best_dir:-none}); the macOS 26 icon catalog cannot be compiled"
            exit 1
          fi

          echo "Selecting $best_dir (actool $best_major)"
          sudo xcode-select -s "$best_dir"

          work="$(mktemp -d)"
          cp -R src-tauri/icons/InkCity.icon "$work/Icon.icon"
          mkdir -p "$work/out"

          echo "--- actool dry run ---"
          status=0
          actool "$work/Icon.icon" \
            --compile "$work/out" \
            --output-format human-readable-text \
            --notices \
            --warnings \
            --output-partial-info-plist "$work/out/assetcatalog_generated_info.plist" \
            --app-icon Icon \
            --include-all-app-icons \
            --accent-color AccentColor \
            --enable-on-demand-resources NO \
            --development-region en \
            --target-device mac \
            --minimum-deployment-target 26.0 \
            --platform macosx || status=$?

          if [ "$status" -ne 0 ] || [ ! -f "$work/out/Assets.car" ]; then
            echo "::error::actool cannot compile src-tauri/icons/InkCity.icon (exit $status) — its diagnostics are above; the build would fail with a bare 'failed to run actool'"
            exit 1
          fi

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "InkCity ${{ inputs.tag || github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # macOS 26 renders the app icon from a compiled asset catalog, not the
      # .icns: the bundler runs `actool` over src-tauri/icons/InkCity.icon to
      # produce Contents/Resources/Assets.car and names it in CFBundleIconName.
      # When actool is missing or older than 26 the bundler logs one line and
      # returns Ok(None) — build succeeds, gets signed, gets published, and the
      # icon silently falls back to the .icns (which macOS 26 then parks in a
      # grey rounded-rect plate). The step above is what prevents that; this one
      # is the backstop, covering the ways the catalog can come out empty even
      # with a new enough actool.
      #
      # Note this runs *after* tauri-action has already uploaded its assets, so a
      # failure here leaves a draft release holding a bad build. That's the
      # intended shape, not an oversight: `publish` needs this job, so the release
      # stays a draft and the updater never sees it. Re-running the workflow
      # against the same tag overwrites the assets in place.
      - name: Verify the macOS 26 icon was compiled into the bundle
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          if [ ${#apps[@]} -ne 1 ]; then
            echo "::error::expected exactly one .app, found ${#apps[@]}"
            exit 1
          fi
          app="${apps[0]}"
          if [ ! -f "$app/Contents/Resources/Assets.car" ]; then
            echo "::error::Assets.car missing from $app — actool was skipped (Xcode < 26?)"
            actool --version --output-format=human-readable-text || true
            exit 1
          fi
          plutil -extract CFBundleIconName raw -o - "$app/Contents/Info.plist" \
            || { echo "::error::CFBundleIconName missing — macOS 26 would fall back to the .icns"; exit 1; }
          # Informational, not a gate: InkCity.icon carries dark-appearance layer
          # variants, so a healthy catalog lists NSAppearanceNameDarkAqua here.
          # Not asserted because assetutil's output format isn't contractual and a
          # false failure would block a release over formatting.
          echo "--- appearances in Assets.car ---"
          assetutil --info "$app/Contents/Resources/Assets.car" | grep -i appearance | sort -u || true

  # Flip the draft release to public + latest, but only after every matrix build
  # has succeeded and uploaded its assets. With fail-fast: false, a single
  # platform failure leaves the release as a draft (invisible to the updater),
  # so users never see a half-built release.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release (draft -> public + latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ inputs.tag || github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
