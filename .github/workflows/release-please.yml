# Automated release management via Conventional Commits.
#
# On every push to main, release-please scans the commits since the last release
# and maintains a "release PR" that bumps the version in package.json +
# src-tauri/tauri.conf.json (see release-please-config.json) and updates
# CHANGELOG.md. `feat:` -> minor, `fix:` -> patch, `feat!:`/`BREAKING CHANGE`
# -> major. Merging that PR makes release-please cut the release.
#
# The release is created as a *draft* (release-please-config.json `draft: true`)
# so it stays out of `releases/latest` until release.yml has uploaded all assets
# — that avoids an updater 404 window. But GitHub does NOT create the git tag for
# a draft release (the ref only appears on publish), and release-please needs
# that tag to (1) trigger release.yml (`on: push: tags`) and (2) anchor the NEXT
# run's "commits since last release". Without the tag, the next run — which the
# action computes in this SAME invocation, right after cutting the release —
# finds 0 releases, loses its anchor, and re-collects the ENTIRE history into a
# bogus release PR (this is what produced the bad #13/#16 PRs).
#
# The fix is `force-tag-creation: true` in release-please-config.json: it makes
# release-please create the tag immediately, in-action, BEFORE it computes the
# next release PR — so the anchor is always present and no bogus PR is generated.
#
# IMPORTANT — the token: a tag created with the default GITHUB_TOKEN does NOT
# trigger other workflows (GitHub blocks recursive workflow runs), so release.yml
# would never fire. Create a fine-grained PAT (or GitHub App token) with
# `contents: write` + `pull-requests: write`, store it as the repo secret
# RELEASE_PLEASE_TOKEN, and it's used below. Without it the tag is still created,
# but it won't trigger release.yml; you'd then run release.yml via
# workflow_dispatch to build.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
