name: Precache OSM

# Fetches the next few days' cities — every map layer, not just roads — and
# publishes them to the `data` branch, which jsDelivr serves as a CDN
# (cdn.jsdelivr.net/gh/<repo>@data). The desktop client pulls from there before
# falling back to the same osm-cli binary run live (as a sidecar), so users on slow
# or Overpass-blocked networks (notably mainland China) get fast, reliable data.
# See scripts/osm-cli.ts and src-tauri/src/cdn.rs.
#
# Every published .json also gets a gzip-compressed sibling. That is NOT for
# bandwidth (jsDelivr already gzips .json over the wire transparently): it's to stay
# under jsDelivr's 20 MB per-file cap, which large/dense cities' plain JSON can
# exceed. The client asks for the .gz first and falls back to the plain .json.

on:
  schedule:
    # Every 6 hours. Most runs are no-ops (skip-existing), but the extra passes
    # give transient Overpass 429s several chances to clear before a city's day
    # arrives, and let a partially-failed window finish filling.
    - cron: "49 1,7,13,19 * * *"
  workflow_dispatch: {} # allow manual runs

# Avoid two runs racing to force-push the data branch.
concurrency:
  group: precache
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  precache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # Water assembly (scripts/osm-cli.ts → src/core/osm/water.ts) needs
      # `polygon-clipping`. `--ignore-scripts` skips the `canvas` native build,
      # which is a devDependency only used by the local render harness, not here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Pull the current data branch so we only fetch cities that aren't cached
      # yet. If the branch doesn't exist yet (first run, or it was deleted), we
      # start fresh — handled gracefully so the step never reports a failure.
      # Any *other* clone failure (auth hiccup, network blip, GitHub outage) must
      # NOT fall into that same "start fresh" path: silently discarding the
      # restored cache would force a full re-fetch of the whole window, and if
      # this run then also can't reach every city, the publish step's force-push
      # would replace the real data branch with that thinner set. So we only
      # treat it as "no branch yet" when git actually says the ref is missing;
      # anything else fails the step (and thus the job) loudly instead.
      - name: Restore existing data branch
        run: |
          set +e
          clone_err=$(git clone --depth 1 --branch data --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-out 2>&1)
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "restored existing data branch"
            rm -rf data-out/.git
          elif echo "$clone_err" | grep -qiE "not found in upstream|couldn't find remote ref|remote branch .* not found"; then
            echo "no data branch yet — starting fresh"
            mkdir -p data-out
          else
            echo "$clone_err" >&2
            echo "::error::git clone of the data branch failed for a reason other than 'branch missing' — aborting instead of silently starting fresh" >&2
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-cache upcoming cities
        run: npx -y tsx@4 scripts/osm-cli.ts precache data-out/osm 7

      # Gzip every cached payload alongside the original so large cities land
      # under jsDelivr's 20 MB per-file cap (the .json itself is kept for older
      # clients / as a fallback — see cdn.rs). `if: always()` so cities fetched
      # before an alarming precache failure still get compressed and
      # published. `-f` re-compresses on every run so a changed .json (or a
      # first-time-gzip of a payload restored from before this step existed)
      # never drifts out of sync with its .gz.
      - name: Gzip-compress cached payloads
        if: always()
        run: |
          shopt -s nullglob
          # Both the id-keyed osm/ payloads and the date-keyed osm-v2/data/
          # manifests (issue #1); nullglob drops either if empty/absent.
          # osm-v2/city-list.json is deliberately outside data/, so this glob
          # can't reach it: it's the schedule's state file, read by the next CI
          # run (and edited by hand) rather than fetched by the client, so a .gz
          # sibling would just be dead weight.
          # The paths must match SCHEDULE_ROOT/SCHEDULE_DATA_DIR in
          # src/core/schedule.ts, which is where the layout is defined.
          files=(data-out/osm/*.json data-out/osm-v2/data/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "nothing to compress"
          else
            gzip -k -f -9 "${files[@]}"
          fi

      # `if: always()` so that when the precache step exits non-zero (its alarm
      # conditions — see scripts/osm-cli.ts), the cities it *did* fetch this
      # run still get published instead of being thrown away and re-fetched next
      # run. The failed precache step still makes the job red (a later
      # `if: always()` step succeeding doesn't un-fail an earlier failed step),
      # so GitHub still emails on the failed scheduled run.
      - name: Publish to data branch
        if: always()
        run: |
          cd data-out
          # Single-commit branch each run: reuse the files restored above, but
          # drop history so the repo never bloats with old OSM blobs.
          rm -rf .git
          # Publish if *either* flow produced something. Checking only osm/ (as
          # this did before osm-v2/ existed) would silently discard a successful
          # schedule run — and still report the job green, since a run that
          # fetched schedule days but no rotation cities isn't a failure. It
          # would also stop publishing entirely if the legacy osm/ flow is ever
          # retired.
          #
          # Note this is now a *narrow* guard, not the safety net it reads as. Any
          # run that reached the schedule leaves osm-v2/city-list.json behind even
          # when every fetch failed (intended — the schedule state is worth
          # publishing on its own), so all it still catches is a precache step that
          # died before writing anything at all: `git commit` on an empty tree
          # exits non-zero and would fail this step for no reason. It does NOT
          # protect against publishing a *thinner* tree than the branch already
          # has; that's the restore step's job, which aborts the whole run on any
          # clone failure other than "branch missing".
          #
          # osm-v2/ must match SCHEDULE_ROOT in src/core/schedule.ts.
          if [ -z "$(ls -A osm 2>/dev/null)" ] && [ -z "$(ls -A osm-v2 2>/dev/null)" ]; then
            echo "nothing to publish (no cities cached, no schedule)"
            exit 0
          fi
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "precache: $(date -u +%F)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
