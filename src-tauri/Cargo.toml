[package]
name = "ink-city"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ink_city_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wallpaper = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
tokio = { version = "1", features = ["sync", "time", "net", "rt-multi-thread", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
semver = "1"
flate2 = "1"
tauri-plugin-log = "2"
log = "0.4"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Recovery",
    # tray_theme.rs: read SystemUsesLightTheme and watch it for changes.
    "Win32_System_Registry",
] }


# Local dev builds only — `[profile.release]` (used by CI and `tauri build`)
# is deliberately left at Cargo's defaults. Full debuginfo is what makes
# src-tauri/target grow into the multi-GB range; line tables still give
# readable panic backtraces for our own code, and dependencies get none at
# all since we never step through them. Cuts the debug dir by roughly 3-4x.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
