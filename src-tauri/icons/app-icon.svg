<?xml version="1.0" encoding="UTF-8"?>
<!-- InkCity app icon (Windows .exe / .ico source): the app's own output — a road
     network on a monitor — sepia ink on cream paper. Source of truth for the
     Windows icon set; the macOS app icon comes from InkCity.icon instead.

     The designer's artwork is 585.45x473.87 (landscape); `tauri icon` requires a
     square input, so it's centred here in a 1024x1024 canvas at 96% width. Do not
     add a rounded-rect or shadow: Windows applies no mask, so the mark's own
     silhouette is what ships.

     bundle.icon lists two art sets because the platforms don't share one: this file
     feeds icon.ico, while icon.icns and the loose PNGs come from InkCity.icon's
     layers. `tauri icon` only takes one input, so it runs twice:

       # Windows — take icon.ico (+ the Square*/StoreLogo set, unused by NSIS/MSI
       # but kept so the directory stays complete)
       pnpm exec tauri icon src-tauri/icons/app-icon.svg -o /tmp/win-out
       cp /tmp/win-out/icon.ico /tmp/win-out/Square*Logo.png /tmp/win-out/StoreLogo.png src-tauri/icons/

       # macOS ≤15 + generic — from a flattened, masked render of InkCity.icon
       # (see that bundle's Assets: the layers are full-bleed and unmasked because
       # macOS 26 applies the mask and shadow itself, so the legacy .icns has to
       # get its own rounded rect, 83.6% inset and drop shadow added first).
       pnpm exec tauri icon /tmp/legacy-1024.png -o /tmp/mac-out
       cp /tmp/mac-out/icon.icns /tmp/mac-out/icon.png /tmp/mac-out/{32x32,64x64,128x128,128x128@2x}.png src-tauri/icons/

     Note what bundle.icon does NOT list: InkCity.icon itself. The bundler can
     compile a .icon on its own, but that path crashes actool on macOS 26
     (tauri-apps/tauri#15315, still open — the identical command run from a shell
     succeeds). So the catalog is pre-compiled to icons/Assets.car
     (scripts/build-icon-car.sh, `pnpm icon:car`, run by CI) and the config points
     at that: create_assets_car_file returns on the first `.car` entry and never
     invokes actool. InkCity.icon stays in the repo as that file's source.

     Keep bundle.icon free of *directories* generally: create_icns_file iterates
     Settings::icon_files(), which is ResourcePaths with allow_walk = false, and
     that yields Err(NotAllowedToWalkDir) on a directory rather than skipping it —
     a failure whose message says nothing about which entry caused it. -->

