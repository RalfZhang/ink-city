<?xml version="1.0" encoding="UTF-8"?>
<!-- InkCity tray / menu bar glyph. Monochrome by design: on macOS this ships as a
     template image (alpha only — the fill colour is discarded and the system tints
     it for the light/dark menu bar), so the 30%-opacity group below renders as
     30% ink rather than as grey. Windows does no such tinting, so the same glyph
     is rasterised twice, once dark and once white — see tray_theme.rs.

     The viewBox is the designer's spec size in points: 27x18, margins included.
     Use it as delivered — do not re-crop. macOS sizes the menu bar image to 18pt
     tall and derives the width, so this canvas maps 1:1 to points and the glyph
     lands exactly where it was drawn to land.

     Windows is the exception: the shell stretches the HICON into a square slot, so
     there the 3:2 canvas is padded with equal transparent bands above and below —
     without that it comes out distorted.

     Regenerate (needs @resvg/resvg-js; nothing here can render SVG natively):
       tray.png          216x144  (macOS template, 8x of 27x18pt)
       tray-win-light.png  32x32  (dark glyph, for a LIGHT taskbar)
       tray-win-dark.png   32x32  (white glyph, for a DARK taskbar) -->
