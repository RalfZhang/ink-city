<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>InkCity — guess today's city</title>
    <meta
      name="description"
      content="Every day a new city, drawn in ink from OpenStreetMap. Guess which country it's in, then make it your desktop wallpaper."
    />
    <meta name="theme-color" content="#eee8d6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="InkCity — guess today's city" />
    <meta
      property="og:description"
      content="Every day a new city, drawn in ink from OpenStreetMap. Guess which country it's in, then make it your desktop wallpaper."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://inkcity.ralfz.com/" />
    <!-- Crawlers need an absolute URL here; the file is public/og-image.jpg. -->
    <meta property="og:image" content="https://inkcity.ralfz.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A city's streets drawn in ink as a laptop wallpaper, half dark, half paper" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The tray's glyph (public/favicon.svg, which follows the browser's theme), and its raster for browsers that take no SVG icon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      The theme before the first paint, so a dark-mode visitor never sees a frame of
      paper: the stylesheet's dark tokens hang off this class, which App.tsx then
      keeps in step with the system.
    -->
    <script>
      if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>InkCity draws today's map in your browser, which needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
